<svg xmlns="http://www.w3.org/2000/svg" width="860" height="660" viewBox="0 0 860 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="1" y="1" width="858" height="658" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- header -->
  <text x="430" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2328">🏛  LLM Council</text>
  <text x="430" y="74" text-anchor="middle" font-size="14" fill="#57606a">ask several models · they review each other anonymously · a chairman synthesizes</text>

  <!-- input -->
  <rect x="320" y="96" width="220" height="44" rx="22" fill="#ffffff" stroke="#d0d7de"/>
  <text x="430" y="123" text-anchor="middle" font-size="15" fill="#1f2328">❓  Your question</text>
  <path d="M430,140 L430,164" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 1 band -->
  <rect x="40" y="164" width="780" height="100" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="188" font-size="13" font-weight="600" fill="#6e40c9">1 — Independent answers · parallel · they don't see each other</text>
  <rect x="70" y="202" width="220" height="46" rx="9" fill="#f3effc" stroke="#6e40c9"/>
  <text x="180" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#6e40c9">Opus</text>
  <text x="180" y="239" text-anchor="middle" font-size="11" fill="#57606a">answers</text>
  <rect x="320" y="202" width="220" height="46" rx="9" fill="#eaf2fd" stroke="#2f6feb"/>
  <text x="430" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#2f6feb">Sonnet</text>
  <text x="430" y="239" text-anchor="middle" font-size="11" fill="#57606a">answers</text>
  <rect x="570" y="202" width="220" height="46" rx="9" fill="#eafaf0" stroke="#1f9d57"/>
  <text x="680" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#1f9d57">Fable</text>
  <text x="680" y="239" text-anchor="middle" font-size="11" fill="#57606a">answers</text>
  <path d="M430,264 L430,288" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 2 band -->
  <rect x="40" y="288" width="780" height="94" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="312" font-size="13" font-weight="600" fill="#6e40c9">2 — Anonymous peer review</text>
  <text x="430" y="342" text-anchor="middle" font-size="13" fill="#1f2328">answers relabeled <tspan font-weight="700">A · B · C</tspan> — identities hidden</text>
  <text x="430" y="364" text-anchor="middle" font-size="13" fill="#57606a">each model ranks all responses best → worst</text>
  <path d="M430,382 L430,406" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 3 band -->
  <rect x="40" y="406" width="780" height="92" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="430" font-size="13" font-weight="600" fill="#6e40c9">3 — Chairman synthesis</text>
  <rect x="270" y="440" width="320" height="48" rx="9" fill="#f3effc" stroke="#6e40c9"/>
  <text x="430" y="462" text-anchor="middle" font-size="15" font-weight="700" fill="#6e40c9">Chairman (Opus)</text>
  <text x="430" y="480" text-anchor="middle" font-size="11" fill="#57606a">resolves disagreements · drops flagged errors</text>
  <path d="M430,498 L430,522" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- final -->
  <rect x="320" y="522" width="220" height="50" rx="10" fill="#1f9d57"/>
  <text x="430" y="553" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">✅  Final answer</text>

  <!-- footer -->
  <text x="430" y="608" text-anchor="middle" font-size="12" fill="#8b949e">runs on the Claude Code subscription · no API keys · via the Workflow tool</text>
  <text x="430" y="628" text-anchor="middle" font-size="11" fill="#afb8c1">port of Andrej Karpathy's llm-council</text>
</svg>
