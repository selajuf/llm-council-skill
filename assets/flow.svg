<svg xmlns="http://www.w3.org/2000/svg" width="860" height="720" viewBox="0 0 860 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="1" y="1" width="858" height="718" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- header -->
  <text x="430" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2328">🏛  LLM Council</text>
  <text x="430" y="80" text-anchor="middle" font-size="14" fill="#57606a">ask several models · they review each other anonymously · a chairman synthesizes</text>

  <!-- Q -->
  <rect x="320" y="104" width="220" height="46" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="430" y="133" text-anchor="middle" font-size="15" fill="#1f2328">❓  Your question</text>

  <!-- fan-out arrows Q -> members -->
  <path d="M430,150 C300,168 200,180 160,200" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M430,150 L430,200" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M430,150 C560,168 660,180 700,200" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 1 -->
  <text x="430" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#6e40c9">1 — Independent answers (parallel)</text>

  <rect x="70" y="204" width="180" height="58" rx="10" fill="#f3effc" stroke="#6e40c9"/>
  <text x="160" y="230" text-anchor="middle" font-size="15" font-weight="600" fill="#6e40c9">Opus</text>
  <text x="160" y="249" text-anchor="middle" font-size="12" fill="#57606a">answers</text>

  <rect x="340" y="204" width="180" height="58" rx="10" fill="#eaf2fd" stroke="#2f6feb"/>
  <text x="430" y="230" text-anchor="middle" font-size="15" font-weight="600" fill="#2f6feb">Sonnet</text>
  <text x="430" y="249" text-anchor="middle" font-size="12" fill="#57606a">answers</text>

  <rect x="610" y="204" width="180" height="58" rx="10" fill="#eafaf0" stroke="#1f9d57"/>
  <text x="700" y="230" text-anchor="middle" font-size="15" font-weight="600" fill="#1f9d57">Fable</text>
  <text x="700" y="249" text-anchor="middle" font-size="12" fill="#57606a">answers</text>

  <!-- fan-in arrows members -> review -->
  <path d="M160,262 C200,300 320,318 360,332" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M430,262 L430,332" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M700,262 C660,300 540,318 500,332" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 2 -->
  <text x="430" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#6e40c9">2 — Anonymous peer review</text>

  <rect x="220" y="336" width="420" height="74" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="430" y="364" text-anchor="middle" font-size="13" fill="#1f2328">answers relabeled <tspan font-weight="700">A · B · C</tspan> — identities hidden</text>
  <text x="430" y="388" text-anchor="middle" font-size="13" fill="#57606a">each model ranks all responses best → worst</text>

  <!-- arrow review -> chairman -->
  <path d="M430,410 L430,462" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 3 -->
  <text x="430" y="454" text-anchor="middle" font-size="13" font-weight="600" fill="#6e40c9">3 — Chairman synthesis</text>

  <rect x="270" y="466" width="320" height="64" rx="10" fill="#f3effc" stroke="#6e40c9"/>
  <text x="430" y="492" text-anchor="middle" font-size="15" font-weight="700" fill="#6e40c9">Chairman (Opus)</text>
  <text x="430" y="513" text-anchor="middle" font-size="12" fill="#57606a">resolves disagreements · drops flagged errors</text>

  <!-- arrow chairman -> final -->
  <path d="M430,530 L430,584" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Final -->
  <rect x="320" y="588" width="220" height="52" rx="10" fill="#1f9d57"/>
  <text x="430" y="620" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">✅  Final answer</text>

  <!-- footer -->
  <text x="430" y="678" text-anchor="middle" font-size="12" fill="#8b949e">runs on the Claude Code subscription · no API keys · via the Workflow tool</text>
  <text x="430" y="698" text-anchor="middle" font-size="11" fill="#afb8c1">port of Andrej Karpathy's llm-council</text>
</svg>
